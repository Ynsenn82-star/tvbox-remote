name: Build TV Remote APK

on:
  workflow_dispatch:
    inputs:
      shortcuts:
        description: 'App shortcuts to add'
        type: choice
        default: youtube_only
        options:
          - youtube_only
          - all
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SHORTCUTS: ${{ github.event.inputs.shortcuts || 'youtube_only' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout Android TV Remote source
        uses: actions/checkout@v4
        with:
          repository: SebghatYusuf/android_remote
          path: app_source

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Show original client source
        working-directory: app_source
        run: |
          echo "::group::tv_remote_client.dart (original)"
          cat -n lib/src/services/tv_remote_client.dart
          echo "::endgroup::"
          echo "::group::message parsing in remote.pb.dart"
          grep -nE "parse|decode|readVarint|_varint|frameMessage|class " lib/src/proto/remote.pb.dart | head -80
          echo "::endgroup::"

      - name: Add App Link codec and verifier
        working-directory: app_source
        run: |
          mkdir -p tool
          cat > lib/src/applink_codec.dart <<'DART'
          import 'dart:convert';
          import 'dart:typed_data';

          class AppLinkDebug {
            static DateTime? lastSent;
            static void markSent() => lastSent = DateTime.now();
            static String msSinceSent() => lastSent == null
                ? 'never'
                : '${DateTime.now().difference(lastSent!).inMilliseconds}';
          }

          class AppLinkCodec {
            static const int _appLinkLaunchField = 90;

            static List<int> _varint(int value) {
              final out = <int>[];
              var v = value;
              while (v > 0x7F) {
                out.add((v & 0x7F) | 0x80);
                v >>= 7;
              }
              out.add(v);
              return out;
            }

            static List<int> _lengthDelimited(int field, List<int> payload) => [
                  ..._varint((field << 3) | 2),
                  ..._varint(payload.length),
                  ...payload,
                ];

            static Uint8List body(String appLink) {
              final inner = _lengthDelimited(1, utf8.encode(appLink));
              return Uint8List.fromList(_lengthDelimited(_appLinkLaunchField, inner));
            }

            static Uint8List frame(String appLink) {
              final b = body(appLink);
              return Uint8List.fromList([..._varint(b.length), ...b]);
            }

            static String hex(List<int> bytes) =>
                bytes.map((x) => x.toRadixString(16).padLeft(2, '0')).join();
          }
          DART

          cat > tool/verify_applink.dart <<'DART'
          import 'dart:io';
          import '../lib/src/applink_codec.dart';

          void main(List<String> args) {
            final tab = String.fromCharCode(9);
            final lines = File(args[0])
                .readAsLinesSync()
                .where((l) => l.trim().isNotEmpty)
                .toList();
            var failed = 0;
            for (final line in lines) {
              final parts = line.split(tab);
              final actual = AppLinkCodec.hex(AppLinkCodec.frame(parts[0]));
              final ok = actual == parts[1];
              stdout.writeln('${ok ? "OK  " : "FAIL"} ${parts[0]}');
              if (!ok) {
                stdout.writeln('  expected ${parts[1]}');
                stdout.writeln('  actual   $actual');
                failed++;
              }
            }
            if (failed > 0 || lines.isEmpty) exit(1);
            stdout.writeln('All ${lines.length} App Link frames match protobuf.');
          }
          DART

      - name: Modify TV Remote
        working-directory: app_source
        run: |
          python3 - <<'PY'
          import os
          import re
          import string
          import sys
          from collections import Counter
          from pathlib import Path

          NL = chr(10)
          WS = "[" + string.whitespace + "]"
          SP = "[ " + chr(9) + "]"
          W = "[A-Za-z0-9_]"
          LP = "[(]"
          RP = "[)]"
          DOT = "[.]"
          LB = "[{]"

          def fail(msg):
              print("PATCH ERROR:", msg)
              sys.exit(1)

          def insert_before(text, pattern, addition, label, first=False):
              ms = list(re.finditer(pattern, text, re.M))
              if not ms or (len(ms) != 1 and not first):
                  fail(label + ": expected one anchor, found " + str(len(ms)))
              pos = ms[0].start()
              return text[:pos] + addition + text[pos:]

          mode = os.environ.get("SHORTCUTS", "youtube_only")
          print("Shortcut mode:", mode)

          FEATURES = [("PING", 1), ("KEY", 2), ("IME", 4), ("POWER", 32),
                      ("VOLUME", 64), ("APP_LINK", 512)]
          proto_path = Path("lib/src/proto/remote.pb.dart")
          if not proto_path.exists():
              fail("lib/src/proto/remote.pb.dart not found")
          proto_text = proto_path.read_text()
          mask_pattern = ("_int32Field" + LP + WS + "*1" + WS + "*," + WS +
                          "*([0-9]+)" + WS + "*" + RP)
          masks = [int(x) for x in re.findall(mask_pattern, proto_text) if int(x) > 64]
          print("Feature masks found in original source:", masks)
          for m in masks:
              print("  ", m, "->", [n for n, b in FEATURES if m & b])
          if len(masks) < 2:
              fail("expected feature masks in both Configure and SetActive")
          for m in masks:
              if not (m & 512):
                  fail("mask " + str(m) + " does not declare APP_LINK (512)")
          print("OK: all feature masks declare APP_LINK; values left unchanged.")

          paths = {
              "client": Path("lib/src/services/tv_remote_client.dart"),
              "provider": Path("lib/src/providers/remote_provider.dart"),
              "ui": Path("lib/src/ui/tv_remote_screen.dart"),
          }
          for k, p in paths.items():
              if not p.exists():
                  fail("missing file " + str(p))

          orig = {k: p.read_text() for k, p in paths.items()}
          new = dict(orig)

          for name in ("_isConnected", "_commandSocket", "_handleDisconnection"):
              if name not in new["client"]:
                  fail(name + " not found in client")
          if "_remoteClient" not in new["provider"]:
              fail("_remoteClient not found in provider")
          for name in ("_Btn", "_Card", "_Label"):
              if name not in new["ui"]:
                  fail(name + " not found in UI")

          send_key_decl = "^" + SP + "*void" + WS + "+sendKeyPress" + WS + "*" + LP

          new["client"] = insert_before(
              new["client"], "^import" + WS,
              "import '../applink_codec.dart';" + NL,
              "client import", first=True)

          LAUNCH_METHOD = """  void launchAppLink(String appLink) {
              if (!_isConnected || _commandSocket == null) {
                // ignore: avoid_print
                print('AppLink skipped: connected=$_isConnected');
                return;
              }
              try {
                final data = AppLinkCodec.frame(appLink);
                // ignore: avoid_print
                print('AppLink -> $appLink (${data.length} bytes): ${AppLinkCodec.hex(data)}');
                AppLinkDebug.markSent();
                _commandSocket!.add(data);
              } catch (e, st) {
                // ignore: avoid_print
                print('AppLink SEND ERROR: $e');
                // ignore: avoid_print
                print('$st');
                _handleDisconnection('Failed to launch app: $e');
              }
            }

          """
          new["client"] = insert_before(
              new["client"], send_key_decl, LAUNCH_METHOD, "client sendKeyPress")

          disc_pattern = ("(?:void|Future<void>)" + WS + "+_handleDisconnection" + WS +
                          "*" + LP + "([^)]*)" + RP + WS + "*(?:async" + WS + "*)?" + LB)
          dm = re.search(disc_pattern, new["client"])
          if dm:
              first_param = dm.group(1).replace("[", "").replace("{", "").split(",")[0]
              first_param = first_param.split("=")[0]
              tokens = re.findall(W + "+", first_param)
              reason = "$" + tokens[-1] if len(tokens) >= 2 else "n/a"
              log = NL.join([
                  "",
                  "    // ignore: avoid_print",
                  "    print('DISCONNECT reason=" + reason +
                  " msSinceAppLink=${AppLinkDebug.msSinceSent()}');",
                  "    // ignore: avoid_print",
                  "    print('${StackTrace.current}');",
              ])
              new["client"] = new["client"][:dm.end()] + log + new["client"][dm.end():]
              print("Disconnect logging added (reason expr:", reason, ")")
          else:
              print("WARNING: could not instrument _handleDisconnection; skipped")

          new["provider"] = insert_before(
              new["provider"], send_key_decl,
              """  void launchAppLink(String appLink) =>
                _remoteClient?.launchAppLink(appLink);

          """,
              "provider sendKeyPress")

          m = re.search("(" + W + "+)" + DOT + "sendKeyPress" + WS + "*" + LP, new["ui"])
          if not m:
              fail("UI notifier not found")
          n = m.group(1)

          all_apps = [
              ("YOUTUBE", "smart_display_rounded", "com.google.android.youtube.tv"),
              ("F LAUNCHER", "home_work_rounded", "me.efesser.flauncher"),
              ("PLAY STORE", "shop_rounded", "com.android.vending"),
              ("FILES", "folder_rounded", "com.alphainventor.filemanager"),
              ("ADB TV", "build_rounded", "com.cybercat.adbappcontrol.tv"),
          ]
          apps = all_apps if mode == "all" else all_apps[:1]

          BUTTON = """                _Btn(
                    icon: Icons.__ICON__,
                    label: '__LABEL__',
                    onTap: () => __N__.launchAppLink('market://launch?id=__PKG__'),
                  ),
          """
          buttons = ""
          for label, icon, pkg in apps:
              buttons += (BUTTON.replace("__ICON__", icon)
                                .replace("__LABEL__", label)
                                .replace("__PKG__", pkg))

          SECTION = """          _Label('APPS'),
                    _Card(
                      child: Wrap(
                        alignment: WrapAlignment.spaceEvenly,
                        spacing: 12,
                        runSpacing: 16,
                        children: [
          __BUTTONS__              ],
                      ),
                    ),
                    const SizedBox(height: 20),
                    _Label('DEVICE'),
                    _Card(
                      child: Row(
                        mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                        children: [
                          _Btn(icon: Icons.settings_rounded, label: 'SETTINGS', onTap: () => __N__.sendKeyPress(176)),
                          _Btn(icon: Icons.power_settings_new_rounded, label: 'POWER', onTap: () => __N__.sendKeyPress(26)),
                        ],
                      ),
                    ),
                    const SizedBox(height: 20),
          """
          addition = SECTION.replace("__BUTTONS__", buttons).replace("__N__", n)

          media_label = "^" + SP + "*_Label" + LP + WS + "*'MEDIA'" + WS + "*" + RP
          new["ui"] = insert_before(new["ui"], media_label, addition, "UI MEDIA")

          for k in paths:
              before = Counter(l.strip() for l in orig[k].splitlines() if l.strip())
              after = Counter(l.strip() for l in new[k].splitlines() if l.strip())
              missing = before - after
              if missing:
                  fail("original lines removed from " + k + ": " + str(list(missing)[:3]))

          print("Original MENU/INPUT lines in UI (kept):")
          for l in orig["ui"].splitlines():
              if "MENU" in l.upper() or "INPUT" in l.upper():
                  print("   ", l.strip())

          for k, p in paths.items():
              p.write_text(new[k])
          print("PATCH SUCCESS. UI notifier:", n)
          PY

      - name: Install dependencies
        working-directory: app_source
        run: flutter pub get

      - name: Verify App Link frames against the OFFICIAL schema
        working-directory: app_source
        run: |
          python3 -m venv /tmp/venv
          . /tmp/venv/bin/activate
          pip install --quiet protobuf grpcio-tools
          mkdir -p /tmp/pb
          curl -fsSL -o /tmp/pb/remotemessage.proto https://github.com/tronikos/androidtvremote2/raw/refs/tags/v0.0.14/src/androidtvremote2/remotemessage.proto
          grep -q "RemoteAppLinkLaunchRequest remote_app_link_launch_request = 90;" /tmp/pb/remotemessage.proto
          grep -q "string app_link = 1;" /tmp/pb/remotemessage.proto
          python -m grpc_tools.protoc -I/tmp/pb --python_out=/tmp/pb /tmp/pb/remotemessage.proto
          python - <<'PY'
          import sys
          sys.path.insert(0, "/tmp/pb")
          import remotemessage_pb2 as pb
          from google.protobuf.internal.encoder import _VarintBytes

          TAB = chr(9)
          NL = chr(10)
          links = [
              "market://launch?id=com.google.android.youtube.tv",
              "market://launch?id=me.efesser.flauncher",
              "market://launch?id=com.android.vending",
              "market://launch?id=com.alphainventor.filemanager",
              "market://launch?id=com.cybercat.adbappcontrol.tv",
              "https://example.com/" + "a" * 130,
          ]
          with open("tool/applink_expected.tsv", "w") as f:
              for link in links:
                  msg = pb.RemoteMessage()
                  msg.remote_app_link_launch_request.app_link = link
                  body = msg.SerializeToString()
                  assert body[:2] == bytes([0xD2, 0x05]), "field 90 tag must be 2 bytes"
                  frame = _VarintBytes(len(body)) + body
                  f.write(link + TAB + frame.hex() + NL)
          print("Expected frames generated from the official schema.")
          PY
          dart run tool/verify_applink.dart tool/applink_expected.tsv

      - name: Analyze Dart code
        working-directory: app_source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build APK
        working-directory: app_source
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-Remote-APK
          path: app_source/build/app/outputs/flutter-apk/app-release.apk
