
name: Build TV Remote APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout Android TV Remote source
        uses: actions/checkout@v4
        with:
          repository: SebghatYusuf/android_remote
          path: app_source

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        working-directory: app_source
        run: flutter pub get

      - name: Build APK
        working-directory: app_source
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-Remote-APK
          path: app_source/build/app/outputs/flutter-apk/app-release.apk
