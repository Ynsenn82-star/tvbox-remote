
name: Build TV Remote APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout Android TV Remote source
        uses: actions/checkout@v4
        with:
          repository: SebghatYusuf/android_remote
          path: app_source

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Modify TV Remote
        working-directory: app_source
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def insert_after(file, anchor, addition):
              p = Path(file)
              content = p.read_text()
              if content.count(anchor) != 1:
                  raise SystemExit(
                      f"ERROR: Anchor not found exactly once in {file}"
                  )
              p.write_text(content.replace(anchor, anchor + addition, 1))
              print("Updated:", file)

          proto_anchor = """  static Uint8List buildKeyInject(int keyCode, int direction) =>
              frameMessage(_bytesField(10, [
                ..._int32Field(1, keyCode),
                ..._int32Field(2, direction),
              ]));"""

          insert_after(
              "lib/src/proto/remote.pb.dart",
              proto_anchor,
              """

            static Uint8List buildAppLinkLaunch(String appLink) =>
                frameMessage(_bytesField(90, _strField(1, appLink)));"""
          )

          insert_after(
              "lib/src/services/tv_remote_client.dart",
              "  void sendKeyPress(int code) => _sendKey(code, RemoteDirection.SHORT);",
              """

              void launchAppLink(String appLink) {
                if (!_isConnected || _commandSocket == null) return;
                try {
                  _commandSocket!.add(RemoteMessage.buildAppLinkLaunch(appLink));
                } catch (e) {
                  _handleDisconnection('Failed to launch app link: $e');
                }
              }"""
          )

          insert_after(
              "lib/src/providers/remote_provider.dart",
              "  void sendKeyPress(int code) => _remoteClient?.sendKeyPress(code);",
              """

              void launchAppLink(String appLink) =>
                  _remoteClient?.launchAppLink(appLink);"""
          )

          ui_anchor = """                _Btn(icon: Icons.skip_next_rounded,     label: 'NEXT', onTap: () => n.sendKeyPress(87)),
                        ],
                      ),
                    ),"""

          ui_addition = """
                    const SizedBox(height: 20),
                    _Label('APPS'),
                    _Card(
                      child: Wrap(
                        alignment: WrapAlignment.spaceEvenly,
                        spacing: 12,
                        runSpacing: 16,
                        children: [
                          _Btn(
                            icon: Icons.smart_display_rounded,
                            label: 'YOUTUBE',
                            onTap: () => n.launchAppLink('market://launch?id=com.google.android.youtube.tv'),
                          ),
                          _Btn(
                            icon: Icons.home_work_rounded,
                            label: 'F LAUNCHER',
                            onTap: () => n.launchAppLink('market://launch?id=me.efesser.flauncher'),
                          ),
                          _Btn(
                            icon: Icons.shop_rounded,
                            label: 'PLAY STORE',
                            onTap: () => n.launchAppLink('market://launch?id=com.android.vending'),
                          ),
                          _Btn(
                            icon: Icons.folder_rounded,
                            label: 'FILE MANAGER +',
                            onTap: () => n.launchAppLink('market://launch?id=com.alphainventor.filemanager'),
                          ),
                          _Btn(
                            icon: Icons.build_rounded,
                            label: 'ADB TV',
                            onTap: () => n.launchAppLink('market://launch?id=com.cybercat.adbappcontrol.tv'),
                          ),
                        ],
                      ),
                    ),
                    const SizedBox(height: 20),
                    _Label('DEVICE'),
                    _Card(
                      child: Row(
                        mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                        children: [
                          _Btn(
                            icon: Icons.settings_rounded,
                            label: 'SETTINGS',
                            onTap: () => n.sendKeyPress(176),
                          ),
                          _Btn(
                            icon: Icons.power_settings_new_rounded,
                            label: 'POWER',
                            onTap: () => n.sendKeyPress(26),
                          ),
                        ],
                      ),
                    ),"""

          insert_after(
              "lib/src/ui/tv_remote_screen.dart",
              ui_anchor,
              ui_addition
          )
          PY

      - name: Install dependencies
        working-directory: app_source
        run: flutter pub get

      - name: Build APK
        working-directory: app_source
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-Remote-APK
          path: app_source/build/app/outputs/flutter-apk/app-release.apk
