name: Build Kotlin TV Remote APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Android TV Remote
    runs-on: ubuntu-latest

    steps:
      - name: Checkout this repository
        uses: actions/checkout@v4

      - name: Download Kotlin remote project
        uses: actions/checkout@v4
        with:
          repository: theharisshah/androidremote
          ref: main
          path: app_source

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: ''

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses
          sdkmanager "platforms;android-37.1" "build-tools;37.0.0"

      - name: Run protocol tests
        working-directory: app_source
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :protocol:test

      - name: Build APK
        working-directory: app_source
        run: |
          ./gradlew --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Kotlin-TV-Remote-APK
          path: app_source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
