name: Build TV Remote APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout Android TV Remote source
        uses: actions/checkout@v4
        with:
          repository: SebghatYusuf/android_remote
          path: app_source

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Patch App Link protocol safely
        working-directory: app_source
        run: |
          python3 - <<'PY'
          import sys
          from pathlib import Path

          def replace_once(path, old, new, label):
              p = Path(path)
              if not p.exists():
                  sys.exit("Missing file: " + path)

              text = p.read_text()
              count = text.count(old)

              if count != 1:
                  sys.exit(
                      f"{label}: expected exactly one match, found {count}"
                  )

              p.write_text(text.replace(old, new, 1))
              print("Patched:", label)

          # 1. Add official Field 90 message using the project's
          # existing Protobuf encoder and Varint framing.
          proto = "lib/src/proto/remote.pb.dart"

          replace_once(
              proto,
              "  /// Parse an incoming RemoteMessage.\n"
              "  static RemoteIncoming parse(Uint8List data) {",
              """  /// Send RemoteAppLinkLaunchRequest (RemoteMessage field 90).
            static Uint8List buildAppLinkLaunch(String appLink) {
              if (appLink.isEmpty) {
                throw ArgumentError('App link cannot be empty');
              }

              final request = _strField(1, appLink);
              return frameMessage(_bytesField(90, request));
            }

            /// Parse an incoming RemoteMessage.
            static RemoteIncoming parse(Uint8List data) {""",
              "Field 90 encoder"
          )

          # 2. Read the TV's feature bitmask from RemoteConfigure.code1.
          replace_once(
              proto,
              """        if (field == 8) {
                    // RemotePingRequest: parse val1 to echo back
                    final pingVal = _firstVarintValue(data.sublist(i, i + len));
                    i += len;
                    return RemoteIncoming(field: 8, pingVal: pingVal);
                  }
                  i += len;
                  return RemoteIncoming(field: field);""",
              """        if (field == 1) {
                    // RemoteConfigure.code1 contains the TV feature bitmask.
                    final code1 = _firstVarintValue(data.sublist(i, i + len));
                    return RemoteIncoming(field: 1, code1: code1);
                  }
                  if (field == 8) {
                    // RemotePingRequest: parse val1 to echo back.
                    final pingVal = _firstVarintValue(data.sublist(i, i + len));
                    return RemoteIncoming(field: 8, pingVal: pingVal);
                  }
                  i += len;
                  return RemoteIncoming(field: field);""",
              "RemoteConfigure feature parser"
          )

          replace_once(
              proto,
              """class RemoteIncoming {
            final int field;
            final int pingVal; // only meaningful when field == 8
            RemoteIncoming({required this.field, this.pingVal = 0});
          }""",
              """class RemoteIncoming {
            final int field;
            final int pingVal;
            final int code1;

            RemoteIncoming({
              required this.field,
              this.pingVal = 0,
              this.code1 = 0,
            });
          }""",
              "RemoteIncoming fields"
          )

          # 3. Add a separate App Link capability flag.
          client = "lib/src/services/tv_remote_client.dart"

          replace_once(
              client,
              "  bool _isConnected = false;",
              "  bool _isConnected = false;\n"
              "  bool _supportsAppLink = false;",
              "Client capability flag"
          )

          replace_once(
              client,
              """  Future<bool> connect(String ip, {int port = 6466}) async {
              try {""",
              """  Future<bool> connect(String ip, {int port = 6466}) async {
              _supportsAppLink = false;
              try {""",
              "Reset App Link capability"
          )

          replace_once(
              client,
              """      case 1: // remoteConfigure – TV requests our device info, reply immediately
                _commandSocket!.add(RemoteMessage.buildConfigure());""",
              """      case 1: // remoteConfigure
                // Feature.APP_LINK = 1 << 9 = 512.
                _supportsAppLink = (incoming.code1 & 512) != 0;
                _commandSocket!.add(RemoteMessage.buildConfigure());""",
              "RemoteConfigure capability check"
          )

          replace_once(
              client,
              "  void sendKeyPress(int code) => _sendKey(code, RemoteDirection.SHORT);",
              """  void launchAppLink(String appLink) {
                if (!_isConnected || _commandSocket == null) return;

                if (!_supportsAppLink) {
                  // ignore: avoid_print
                  print('TV does not advertise App Link support.');
                  return;
                }

                if (appLink.isEmpty) return;

                _commandSocket!.add(
                  RemoteMessage.buildAppLinkLaunch(appLink),
                );
              }

              void sendKeyPress(int code) =>
                  _sendKey(code, RemoteDirection.SHORT);""",
              "Client App Link method"
          )

          # 4. Expose the method through the existing Riverpod notifier.
          provider = "lib/src/providers/remote_provider.dart"

          replace_once(
              provider,
              "  void sendKeyPress(int code) => _remoteClient?.sendKeyPress(code);",
              """  void launchAppLink(String appLink) =>
              _remoteClient?.launchAppLink(appLink);

            void sendKeyPress(int code) => _remoteClient?.sendKeyPress(code);""",
              "Provider App Link method"
          )

          # 5. Add YouTube only, immediately before the existing MEDIA section.
          ui = "lib/src/ui/tv_remote_screen.dart"

          replace_once(
              ui,
              "          _Label('MEDIA'),",
              """          _Label('APPS'),
                    _Card(
                      child: Row(
                        mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                        children: [
                          _Btn(
                            icon: Icons.smart_display_rounded,
                            label: 'YOUTUBE',
                            onTap: () => n.launchAppLink(
                              'market://launch?id=com.google.android.youtube.tv',
                            ),
                          ),
                        ],
                      ),
                    ),
                    const SizedBox(height: 20),
                    _Label('MEDIA'),""",
              "YouTube UI button"
          )

          # 6. Explicitly verify the original MENU and INPUT controls remain.
          ui_text = Path(ui).read_text()

          required_buttons = [
              "label: 'MENU',  onTap: () => n.sendKeyPress(82)",
              "label: 'INPUT', onTap: () => n.sendKeyPress(178)",
          ]

          for button in required_buttons:
              if button not in ui_text:
                  sys.exit("Original remote button missing: " + button)

          print("All source patches completed.")
          print("MENU and INPUT original key codes verified.")
          PY

      - name: Add exact Protobuf reference tests
        working-directory: app_source
        run: |
          mkdir -p test

          cat > test/app_link_protocol_test.dart <<'DART'
          import 'dart:typed_data';

          import 'package:flutter_test/flutter_test.dart';
          import '../lib/src/proto/remote.pb.dart';

          void main() {
            test('Field 90 matches the complete reference bytes', () {
              const link =
                  'market://launch?id=com.google.android.youtube.tv';

              final actual = RemoteMessage.buildAppLinkLaunch(link);

              final actualHex = actual
                  .map((b) => b.toRadixString(16).padLeft(2, '0'))
                  .join();

              const expectedHex =
                  '35d205320a306d61726b65743a2f2f6c61756e63683f69643d'
                  '636f6d2e676f6f676c652e616e64726f69642e796f7574756265'
                  '2e7476';

              expect(actualHex, expectedHex);
              expect(actual.first, 0x35);
              expect(actual.length, 54);
            });

            test('RemoteConfigure reads the App Link feature bit', () {
              // RemoteConfigure.code1 = 622.
              final incoming = RemoteMessage.parse(
                Uint8List.fromList([0x0a, 0x03, 0x08, 0x8e, 0x04]),
              );

              expect(incoming.field, 1);
              expect(incoming.code1, 622);
              expect(incoming.code1 & 512, 512);
            });

            test('RemoteConfigure without App Link bit is detected', () {
              // RemoteConfigure.code1 = 110 (no bit 512).
              final incoming = RemoteMessage.parse(
                Uint8List.fromList([0x0a, 0x02, 0x08, 0x6e]),
              );

              expect(incoming.field, 1);
              expect(incoming.code1 & 512, 0);
            });
          }
          DART

      - name: Install dependencies
        working-directory: app_source
        run: flutter pub get

      - name: Analyze Flutter project
        working-directory: app_source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Run tests
        working-directory: app_source
        run: flutter test

      - name: Build Release APK
        working-directory: app_source
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-Remote-APK
          path: app_source/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
