
name: Build TV Remote APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout Android TV Remote source
        uses: actions/checkout@v4
        with:
          repository: SebghatYusuf/android_remote
          path: app_source

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Modify TV Remote
        working-directory: app_source
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def patch_regex(file, pattern, addition, description):
              p = Path(file)
              content = p.read_text()

              updated, count = re.subn(
                  pattern,
                  lambda m: m.group(0) + addition,
                  content,
                  count=1,
                  flags=re.MULTILINE | re.DOTALL
              )

              if count != 1:
                  raise SystemExit(
                      f"PATCH ERROR in {file}: {description} "
                      f"matched {count} times"
                  )

              p.write_text(updated)
              print("Patched:", description)

          # 1. Add app launch message to protocol
          proto_pattern = (
              r"  static Uint8List buildKeyInject\(int keyCode, int direction\) =>"
              r"\s*frameMessage\(_bytesField\(10, \["
              r"\s*\.\.\._int32Field\(1, keyCode\),"
              r"\s*\.\.\._int32Field\(2, direction\),"
              r"\s*\]\)\);"
          )

          proto_addition = """

            static Uint8List buildAppLinkLaunch(String appLink) =>
                frameMessage(_bytesField(90, _strField(1, appLink)));
          """

          patch_regex(
              "lib/src/proto/remote.pb.dart",
              proto_pattern,
              proto_addition,
              "buildAppLinkLaunch"
          )

          # 2. Add launch method to TV remote client
          client_anchor = (
              r"  void sendKeyPress\(int code\) => "
              r"_sendKey\(code, RemoteDirection\.SHORT\);"
          )

          client_addition = """

            void launchAppLink(String appLink) {
              if (!_isConnected || _commandSocket == null) return;
              try {
                _commandSocket!.add(
                  RemoteMessage.buildAppLinkLaunch(appLink)
                );
              } catch (e) {
                _handleDisconnection('Failed to launch app link: $e');
              }
            }
          """

          patch_regex(
              "lib/src/services/tv_remote_client.dart",
              client_anchor,
              client_addition,
              "TVRemoteClient.launchAppLink"
          )

          # 3. Add launch method to provider
          provider_anchor = (
              r"  void sendKeyPress\(int code\) => "
              r"_remoteClient\?\.sendKeyPress\(code\);"
          )

          provider_addition = """

            void launchAppLink(String appLink) =>
                _remoteClient?.launchAppLink(appLink);
          """

          patch_regex(
              "lib/src/providers/remote_provider.dart",
              provider_anchor,
              provider_addition,
              "RemoteNotifier.launchAppLink"
          )

          # 4. Add app shortcuts and device buttons after MEDIA section
          ui_pattern = (
              r"          _Label\('MEDIA'\),"
              r".*?"
              r"                _Btn\(icon: Icons\.skip_next_rounded,"
              r".*?"
              r"              \],\n"
              r"            \),\n"
              r"          \),"
          )

          ui_addition = """

                    const SizedBox(height: 20),
                    _Label('APPS'),
                    _Card(
                      child: Wrap(
                        alignment: WrapAlignment.spaceEvenly,
                        spacing: 12,
                        runSpacing: 16,
                        children: [
                          _Btn(
                            icon: Icons.smart_display_rounded,
                            label: 'YOUTUBE',
                            onTap: () => n.launchAppLink(
                              'market://launch?id=com.google.android.youtube.tv',
                            ),
                          ),
                          _Btn(
                            icon: Icons.home_work_rounded,
                            label: 'F LAUNCHER',
                            onTap: () => n.launchAppLink(
                              'market://launch?id=me.efesser.flauncher',
                            ),
                          ),
                          _Btn(
                            icon: Icons.shop_rounded,
                            label: 'PLAY STORE',
                            onTap: () => n.launchAppLink(
                              'market://launch?id=com.android.vending',
                            ),
                          ),
                          _Btn(
                            icon: Icons.folder_rounded,
                            label: 'FILE MANAGER +',
                            onTap: () => n.launchAppLink(
                              'market://launch?id=com.alphainventor.filemanager',
                            ),
                          ),
                          _Btn(
                            icon: Icons.build_rounded,
                            label: 'ADB TV',
                            onTap: () => n.launchAppLink(
                              'market://launch?id=com.cybercat.adbappcontrol.tv',
                            ),
                          ),
                        ],
                      ),
                    ),
                    const SizedBox(height: 20),
                    _Label('DEVICE'),
                    _Card(
                      child: Row(
                        mainAxisAlignment: MainAxisAlignment.spaceEvenly,
                        children: [
                          _Btn(
                            icon: Icons.settings_rounded,
                            label: 'SETTINGS',
                            onTap: () => n.sendKeyPress(176),
                          ),
                          _Btn(
                            icon: Icons.power_settings_new_rounded,
                            label: 'POWER',
                            onTap: () => n.sendKeyPress(26),
                          ),
                        ],
                      ),
                    ),"""

          patch_regex(
              "lib/src/ui/tv_remote_screen.dart",
              ui_pattern,
              ui_addition,
              "App shortcuts and device buttons"
          )

          print("All modifications completed successfully.")
          PY

      - name: Install dependencies
        working-directory: app_source
        run: flutter pub get

      - name: Build APK
        working-directory: app_source
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-Remote-APK
          path: app_source/build/app/outputs/flutter-apk/app-release.apk
