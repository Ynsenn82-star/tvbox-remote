
name: Build TV Remote Magic APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout customization repository
        uses: actions/checkout@v4

      - name: Checkout original Android Remote
        uses: actions/checkout@v4
        with:
          repository: theharisshah/androidremote
          ref: main
          path: upstream

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          sdkmanager "platforms;android-37.1" "build-tools;37.0.0"
          yes | sdkmanager --licenses

      - name: Customize application
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("upstream")
          shortcut_file = root / "app/src/main/kotlin/dev/haris/atvremote/data/AppShortcut.kt"
          strings_file = root / "app/src/main/res/values/strings.xml"

          source = shortcut_file.read_text()

          # Keep only the requested applications.
          # Do not modify connection or reconnection code.
          start = source.find("AppShortcut(\"YouTube\"")
          if start == -1:
              raise SystemExit("YouTube shortcut not found")

          # Replace the existing shortcut list using the known list boundary.
          import re
          pattern = re.compile(
              r'(?ms)(AppShortcut\("YouTube".*?)(?=\n\s*\)\s*\n|\n\s*\]\s*\n)'
          )

          match = pattern.search(source)
          if not match:
              raise SystemExit("Could not safely locate shortcut list")

          shortcuts = '''AppShortcut("YouTube", "https://www.youtube.com",
                  "https://play.google.com/store/apps/details?id=com.google.android.youtube.tv"),
              AppShortcut("Google Play Store", "https://play.google.com/store/apps/details?id=com.android.vending",
                  "https://play.google.com/store/apps/details?id=com.android.vending"),
              AppShortcut("File Manager", "https://play.google.com/store/apps/details?id=com.deepakpk.tvexplorer",
                  "https://play.google.com/store/apps/details?id=com.deepakpk.tvexplorer"),
              AppShortcut("FLauncher", "https://play.google.com/store/apps/details?id=me.efesser.flauncher",
                  "https://play.google.com/store/apps/details?id=me.efesser.flauncher")'''

          updated = source[:match.start()] + shortcuts + source[match.end():]
          shortcut_file.write_text(updated)

          strings = strings_file.read_text()
          strings = strings.replace("ATV Remote", "TV Remote Magic")
          strings_file.write_text(strings)

          print("Customization completed")
          print("Spotify removed")
          print("Four requested shortcuts configured")
          PY

      - name: Build debug APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :protocol:test :app:assembleDebug

      - name: Verify APK
        run: |
          APK="upstream/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-Remote-Magic-APK
          path: upstream/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
