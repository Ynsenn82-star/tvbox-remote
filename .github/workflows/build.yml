
name: Build TV Remote APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout Android TV Remote source
        uses: actions/checkout@v4
        with:
          repository: SebghatYusuf/android_remote
          path: app_source

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Inspect source
        working-directory: app_source
        run: |
          grep -n "buildKeyInject\|_bytesField\|_strField" lib/src/proto/remote.pb.dart
          grep -n "sendKeyPress\|_sendKey\|_isConnected\|_commandSocket\|_handleDisconnection" lib/src/services/tv_remote_client.dart
          grep -n "sendKeyPress\|_remoteClient" lib/src/providers/remote_provider.dart
          grep -n "MEDIA\|sendKeyPress" lib/src/ui/tv_remote_screen.dart

      - name: Modify TV Remote
        working-directory: app_source
        run: |
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          def insert_before(text, pattern, addition, label):
              matches = list(re.finditer(pattern, text, re.M))

              if len(matches) != 1:
                  print(
                      f"PATCH ERROR: {label}: "
                      f"found {len(matches)} matches"
                  )
                  sys.exit(1)

              pos = matches[0].start()
              return text[:pos] + addition + text[pos:]

          files = {
              "proto": "lib/src/proto/remote.pb.dart",
              "client": "lib/src/services/tv_remote_client.dart",
              "provider": "lib/src/providers/remote_provider.dart",
              "ui": "lib/src/ui/tv_remote_screen.dart",
          }

          src = {
              key: Path(path).read_text()
              for key, path in files.items()
          }

          # 1. Add app link launch protocol message

          src["proto"] = insert_before(
              src["proto"],
              r"^[ \t]*static\s+Uint8List\s+buildKeyInject\b",
              "  static Uint8List buildAppLinkLaunch(String appLink) =>\n"
              "      frameMessage(_bytesField(90, _strField(1, appLink)));\n\n",
              "proto buildKeyInject",
          )

          # 2. Add app launch method to remote client

          src["client"] = insert_before(
              src["client"],
              r"^[ \t]*void\s+sendKeyPress\s*\(",
              """  void launchAppLink(String appLink) {
              if (!_isConnected || _commandSocket == null) return;

              try {
                _commandSocket!.add(
                  RemoteMessage.buildAppLinkLaunch(appLink)
                );
              } catch (e) {
                _handleDisconnection(
                  'Failed to launch app link: $e'
                );
              }
            }

          """,
              "client sendKeyPress",
          )

          # 3. Add method to remote provider

          src["provider"] = insert_before(
              src["provider"],
              r"^[ \t]*void\s+sendKeyPress\s*\(",
              "  void launchAppLink(String appLink) =>\n"
              "      _remoteClient?.launchAppLink(appLink);\n\n",
              "provider sendKeyPress",
          )

          # 4. Find the notifier variable used in the UI

          matches = list(
              re.finditer(
                  r"(\w+)\.sendKeyPress\s*\(",
                  src["ui"]
              )
          )

          if not matches:
              print("PATCH ERROR: no sendKeyPress call found in UI")
              sys.exit(1)

          notifier = matches[0].group(1)

          # 5. Build app shortcut buttons

          def app_button(label, icon, package):
              return f"""                _Btn(
                  icon: Icons.{icon},
                  label: '{label}',
                  onTap: () => {notifier}.launchAppLink(
                    'market://launch?id={package}',
                  ),
                ),
          """

          ui_add = (
              "          _Label('APPS'),\n"
              "          _Card(\n"
              "            child: Wrap(\n"
              "              alignment: WrapAlignment.spaceEvenly,\n"
              "              spacing: 12,\n"
              "              runSpacing: 16,\n"
              "              children: [\n"
              + app_button(
                  "YOUTUBE",
                  "smart_display_rounded",
                  "com.google.android.youtube.tv"
              )
              + app_button(
                  "F LAUNCHER",
                  "home_work_rounded",
                  "me.efesser.flauncher"
              )
              + app_button(
                  "PLAY STORE",
                  "shop_rounded",
                  "com.android.vending"
              )
              + app_button(
                  "FILE MANAGER +",
                  "folder_rounded",
                  "com.alphainventor.filemanager"
              )
              + app_button(
                  "ADB TV",
                  "build_rounded",
                  "com.cybercat.adbappcontrol.tv"
              )
              + "              ],\n"
                "            ),\n"
                "          ),\n"
                "          const SizedBox(height: 20),\n"
                "          _Label('DEVICE'),\n"
                "          _Card(\n"
                "            child: Row(\n"
                "              mainAxisAlignment: MainAxisAlignment.spaceEvenly,\n"
                "              children: [\n"
                f"                _Btn(icon: Icons.settings_rounded, label: 'SETTINGS', onTap: () => {notifier}.sendKeyPress(176)),\n"
                f"                _Btn(icon: Icons.power_settings_new_rounded, label: 'POWER', onTap: () => {notifier}.sendKeyPress(26)),\n"
                "              ],\n"
                "            ),\n"
                "          ),\n"
                "          const SizedBox(height: 20),\n"
          )

          # 6. Insert shortcuts before MEDIA

          src["ui"] = insert_before(
              src["ui"],
              r"^[ \t]*_Label\(\s*'MEDIA'\s*\)",
              ui_add,
              "UI MEDIA label",
          )

          # 7. Write files only after every patch succeeds

          for key, path in files.items():
              Path(path).write_text(src[key])

          print("All modifications applied successfully.")
          print("UI notifier variable:", notifier)

          PY

      - name: Install dependencies
        working-directory: app_source
        run: flutter pub get

      - name: Build APK
        working-directory: app_source
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-Remote-APK
          path: app_source/build/app/outputs/flutter-apk/app-release.apk
