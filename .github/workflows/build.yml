
name: Build TV Remote Magic APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout customization repository
        uses: actions/checkout@v4

      - name: Checkout original Android Remote
        uses: actions/checkout@v4
        with:
          repository: theharisshah/androidremote
          ref: main
          path: upstream

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: |
            platforms;android-37
            build-tools;37.0.0

      - name: Customize application
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          root = Path("upstream")

          shortcut_file = root / "app/src/main/kotlin/dev/haris/atvremote/data/AppShortcut.kt"
          strings_file = root / "app/src/main/res/values/strings.xml"

          source = shortcut_file.read_text()

          pattern = re.compile(
              r'val DEFAULT_APP_SHORTCUTS: List<AppShortcut> = listOf\(.*?\n\)',
              re.DOTALL
          )

          shortcuts = '''val DEFAULT_APP_SHORTCUTS: List<AppShortcut> = listOf(
              AppShortcut("YouTube", "https://www.youtube.com"),
              AppShortcut("Google Play Store", "https://play.google.com/store/apps/details?id=com.android.vending"),
              AppShortcut("File Manager", "https://play.google.com/store/apps/details?id=com.lonelycatgames.Xplore"),
              AppShortcut("FLauncher", "https://play.google.com/store/apps/details?id=me.efesser.flauncher"),
          )'''

          updated, count = pattern.subn(
              lambda match: shortcuts,
              source,
              count=1
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: Could not safely replace DEFAULT_APP_SHORTCUTS"
              )

          shortcut_file.write_text(updated)

          strings = strings_file.read_text()
          strings = strings.replace("ATV Remote", "TV Remote Magic")
          strings_file.write_text(strings)

          print("TV Remote Magic customization completed")
          print("YouTube: enabled")
          print("Google Play Store: enabled")
          print("File Manager: enabled")
          print("FLauncher: enabled")
          print("Other default shortcuts removed")
          PY

      - name: Build APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :protocol:test :app:assembleDebug

      - name: Verify APK
        run: |
          APK="upstream/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          ls -lh "$APK"
          sha256sum "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-Remote-Magic-APK
          path: upstream/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
