
name: Build TV Remote APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout Android TV Remote source
        uses: actions/checkout@v4
        with:
          repository: SebghatYusuf/android_remote
          path: app_source

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Modify TV Remote
        working-directory: app_source
        run: |
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          def insert_before(text, pattern, addition, label):
              matches = list(re.finditer(pattern, text, re.M))
              if len(matches) != 1:
                  sys.exit(
                      f"PATCH ERROR: {label}: found {len(matches)} matches"
                  )
              pos = matches[0].start()
              return text[:pos] + addition + text[pos:]

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  sys.exit(
                      f"PATCH ERROR: {label}: found {count} matches"
                  )
              return text.replace(old, new, 1)

          proto = Path("lib/src/proto/remote.pb.dart")
          client = Path("lib/src/services/tv_remote_client.dart")
          provider = Path("lib/src/providers/remote_provider.dart")
          ui = Path("lib/src/ui/tv_remote_screen.dart")

          p = proto.read_text()
          c = client.read_text()
          pr = provider.read_text()
          u = ui.read_text()

          # 1. Correct Android TV Remote feature flags.
          p = replace_once(
              p,
              "_int32Field(1, 622)",
              "_int32Field(1, 611)",
              "Configure feature flags",
          )

          p = replace_once(
              p,
              "_int32Field(1, 622)",
              "_int32Field(1, 611)",
              "SetActive feature flags",
          )

          # 2. Add App Link launch message (RemoteMessage field 90).
          p = insert_before(
              p,
              r"^[ \t]*/// Send a key event",
              """  /// Launch an Android TV app using App Link.
            static Uint8List buildAppLinkLaunch(String appLink) =>
                frameMessage(_bytesField(90, _strField(1, appLink)));

          """,
              "App Link protocol method",
          )

          # 3. Add launch method to the actual remote client.
          c = insert_before(
              c,
              r"^[ \t]*void sendKeyPress\(int code\)",
              """  void launchAppLink(String appLink) {
              if (!_isConnected || _commandSocket == null) return;
              try {
                _commandSocket!.add(
                  RemoteMessage.buildAppLinkLaunch(appLink),
                );
              } catch (e) {
                _handleDisconnection('Failed to launch app: $e');
              }
            }

          """,
              "Client sendKeyPress",
          )

          # 4. Add public method to provider.
          pr = insert_before(
              pr,
              r"^[ \t]*void sendKeyPress\(int code\)",
              """  void launchAppLink(String appLink) =>
              _remoteClient?.launchAppLink(appLink);

          """,
              "Provider sendKeyPress",
          )

          # 5. Find the actual UI notifier.
          matches = list(re.finditer(
              r"(\w+)\.sendKeyPress\s*\(",
              u
          ))

          if not matches:
              sys.exit("PATCH ERROR: UI notifier not found")

          notifier = matches[0].group(1)

          apps = [
              ("YOUTUBE", "smart_display_rounded",
               "com.google.android.youtube.tv"),
              ("F LAUNCHER", "home_work_rounded",
               "me.efesser.flauncher"),
              ("PLAY STORE", "shop_rounded",
               "com.android.vending"),
              ("FILE MANAGER +", "folder_rounded",
               "com.alphainventor.filemanager"),
              ("ADB TV", "build_rounded",
               "com.cybercat.adbappcontrol.tv"),
          ]

          buttons = ""
          for label, icon, package in apps:
              buttons += f"""
                  _Btn(
                    icon: Icons.{icon},
                    label: '{label}',
                    onTap: () => {notifier}.launchAppLink(
                      'market://launch?id={package}',
                    ),
                  ),
          """

          addition = (
              "          _Label('APPS'),\n"
              "          _Card(\n"
              "            child: Wrap(\n"
              "              alignment: WrapAlignment.spaceEvenly,\n"
              "              spacing: 12,\n"
              "              runSpacing: 16,\n"
              "              children: [\n"
              + buttons +
              "              ],\n"
              "            ),\n"
              "          ),\n"
              "          const SizedBox(height: 20),\n"
              "          _Label('DEVICE'),\n"
              "          _Card(\n"
              "            child: Row(\n"
              "              mainAxisAlignment: MainAxisAlignment.spaceEvenly,\n"
              "              children: [\n"
              f"                _Btn(icon: Icons.settings_rounded, label: 'SETTINGS', onTap: () => {notifier}.sendKeyPress(176)),\n"
              f"                _Btn(icon: Icons.power_settings_new_rounded, label: 'POWER', onTap: () => {notifier}.sendKeyPress(26)),\n"
              "              ],\n"
              "            ),\n"
              "          ),\n"
              "          const SizedBox(height: 20),\n"
          )

          u = insert_before(
              u,
              r"^[ \t]*_Label\('MEDIA'\)",
              addition,
              "UI MEDIA section",
          )

          # Write only after all checks pass.
          proto.write_text(p)
          client.write_text(c)
          provider.write_text(pr)
          ui.write_text(u)

          print("PATCH SUCCESS")
          print("App Link method added.")
          print("Feature flags set to 611.")
          print("UI notifier:", notifier)
          PY

      - name: Install dependencies
        working-directory: app_source
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: app_source
        run: flutter analyze

      - name: Build APK
        working-directory: app_source
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-Remote-APK
          path: app_source/build/app/outputs/flutter-apk/app-release.apk
