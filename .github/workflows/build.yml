
name: Build TV Remote APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout Android TV Remote source
        uses: actions/checkout@v4
        with:
          repository: SebghatYusuf/android_remote
          path: app_source

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Modify TV Remote
        working-directory: app_source
        run: |
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          def replace_once(text, pattern, replacement, label, flags=re.M):
              result, count = re.subn(
                  pattern, lambda m: replacement,
                  text, count=1, flags=flags
              )
              if count != 1:
                  sys.exit(f"PATCH ERROR: {label}: found {count}")
              return result

          files = {
              "proto": Path("lib/src/proto/remote.pb.dart"),
              "client": Path("lib/src/services/tv_remote_client.dart"),
              "provider": Path("lib/src/providers/remote_provider.dart"),
              "ui": Path("lib/src/ui/tv_remote_screen.dart"),
          }

          src = {key: path.read_text() for key, path in files.items()}

          # 1. Protocol: negotiate supported features

          src["proto"] = replace_once(
              src["proto"],
              r"  static Uint8List buildConfigure\(\)\s*\{.*?\n  \}",
              """  static Uint8List buildConfigure(int features) {
              final deviceInfo = [
                ..._strField(1, 'Flutter Remote'),
                ..._strField(2, 'FlutterDev'),
                ..._int32Field(3, 1),
                ..._strField(4, '1'),
                ..._strField(5, 'com.flutterremote'),
                ..._strField(6, '1.0.0'),
              ];
              return frameMessage(
                _bytesField(1, [
                  ..._int32Field(1, features),
                  ..._bytesField(2, deviceInfo),
                ]),
              );
            }""",
              "buildConfigure",
              re.S,
          )

          src["proto"] = replace_once(
              src["proto"],
              r"  static Uint8List buildSetActive\(\)\s*=>.*?;",
              """  static Uint8List buildSetActive(int features) =>
              frameMessage(_bytesField(2, _int32Field(1, features)));""",
              "buildSetActive",
              re.S,
          )

          # 2. Add the correct App Link message (field 90)

          src["proto"] = replace_once(
              src["proto"],
              r"  /// Send a key event \(field 10 = remote_key_inject\)",
              """  /// Launch an app using Android TV Remote App Link (field 90).
            static Uint8List buildAppLinkLaunch(String appLink) =>
                frameMessage(_bytesField(90, _strField(1, appLink)));

            /// Send a key event (field 10 = remote_key_inject)""",
              "App Link message",
          )

          # 3. Read the TV feature flags from RemoteConfigure

          old_parse = """        if (field == 8) {
                    // RemotePingRequest: parse val1 to echo back
                    final pingVal = _firstVarintValue(data.sublist(i, i + len));
                    i += len;
                    return RemoteIncoming(field: 8, pingVal: pingVal);
                  }
                  i += len;
                  return RemoteIncoming(field: field);"""

          new_parse = """        if (field == 1) {
                    // RemoteConfigure: code1 contains supported feature flags.
                    final features = _firstVarintValue(data.sublist(i, i + len));
                    i += len;
                    return RemoteIncoming(
                      field: 1,
                      configureCode1: features,
                    );
                  }
                  if (field == 8) {
                    // RemotePingRequest: parse val1 to echo back.
                    final pingVal = _firstVarintValue(data.sublist(i, i + len));
                    i += len;
                    return RemoteIncoming(field: 8, pingVal: pingVal);
                  }
                  i += len;
                  return RemoteIncoming(field: field);"""

          if old_parse not in src["proto"]:
              sys.exit("PATCH ERROR: RemoteMessage.parse block not found")

          src["proto"] = src["proto"].replace(old_parse, new_parse, 1)

          src["proto"] = replace_once(
              src["proto"],
              r"class RemoteIncoming\s*\{.*?\n\}",
              """class RemoteIncoming {
              final int field;
              final int pingVal;
              final int configureCode1;

              RemoteIncoming({
                required this.field,
                this.pingVal = 0,
                this.configureCode1 = 0,
              });
            }""",
              "RemoteIncoming",
              re.S,
          )

          # 4. Client: intersect TV features with our supported features

          src["client"] = replace_once(
              src["client"],
              r"  bool _isConnected = false;",
              "  bool _isConnected = false;\n"
              "  int _activeFeatures = 622;",
              "client feature flags",
          )

          old_cases = """      case 1: // remoteConfigure – TV requests our device info, reply immediately
                _commandSocket!.add(RemoteMessage.buildConfigure());
                break;
              case 2: // remoteSetActive
                _commandSocket!.add(RemoteMessage.buildSetActive());
                break;"""

          new_cases = """      case 1: // remoteConfigure
                _activeFeatures &= incoming.configureCode1;
                _commandSocket!.add(
                  RemoteMessage.buildConfigure(_activeFeatures),
                );
                break;
              case 2: // remoteSetActive
                _commandSocket!.add(
                  RemoteMessage.buildSetActive(_activeFeatures),
                );
                break;"""

          if old_cases not in src["client"]:
              sys.exit("PATCH ERROR: client configure handlers not found")

          src["client"] = src["client"].replace(old_cases, new_cases, 1)

          # 5. Client: launch only when the TV supports APP_LINK (512)

          src["client"] = replace_once(
              src["client"],
              r"^[ \t]*void sendKeyPress\(int code\)",
              """  void launchAppLink(String appLink) {
              if (!_isConnected || _commandSocket == null) return;

              // APP_LINK = 2^9 = 512
              if ((_activeFeatures & 512) == 0) {
                return;
              }

              try {
                _commandSocket!.add(
                  RemoteMessage.buildAppLinkLaunch(appLink),
                );
              } catch (e) {
                _handleDisconnection('Failed to launch app link: $e');
              }
            }

            void sendKeyPress(int code)""",
          )

          # 6. Provider method

          src["provider"] = replace_once(
              src["provider"],
              r"^[ \t]*void sendKeyPress\s*\(",
              """  void launchAppLink(String appLink) =>
                _remoteClient?.launchAppLink(appLink);

            void sendKeyPress(""",
              "provider launch method",
          )

          # 7. Find the UI notifier

          matches = list(re.finditer(
              r"(\w+)\.sendKeyPress\s*\(",
              src["ui"]
          ))

          if not matches:
              sys.exit("PATCH ERROR: UI notifier not found")

          notifier = matches[0].group(1)

          apps = [
              ("YOUTUBE", "smart_display_rounded",
               "com.google.android.youtube.tv"),
              ("F LAUNCHER", "home_work_rounded",
               "me.efesser.flauncher"),
              ("PLAY STORE", "shop_rounded",
               "com.android.vending"),
              ("FILE MANAGER +", "folder_rounded",
               "com.alphainventor.filemanager"),
              ("ADB TV", "build_rounded",
               "com.cybercat.adbappcontrol.tv"),
          ]

          buttons = ""

          for label, icon, package in apps:
              buttons += f"""
                  _Btn(
                    icon: Icons.{icon},
                    label: '{label}',
                    onTap: () => {notifier}.launchAppLink(
                      'market://launch?id={package}',
                    ),
                  ),
          """

          ui_add = (
              "          _Label('APPS'),\n"
              "          _Card(\n"
              "            child: Wrap(\n"
              "              alignment: WrapAlignment.spaceEvenly,\n"
              "              spacing: 12,\n"
              "              runSpacing: 16,\n"
              "              children: [\n"
              + buttons +
              "              ],\n"
              "            ),\n"
              "          ),\n"
              "          const SizedBox(height: 20),\n"
              "          _Label('DEVICE'),\n"
              "          _Card(\n"
              "            child: Row(\n"
              "              mainAxisAlignment: MainAxisAlignment.spaceEvenly,\n"
              "              children: [\n"
              f"                _Btn(icon: Icons.settings_rounded, label: 'SETTINGS', onTap: () => {notifier}.sendKeyPress(176)),\n"
              f"                _Btn(icon: Icons.power_settings_new_rounded, label: 'POWER', onTap: () => {notifier}.sendKeyPress(26)),\n"
              "              ],\n"
              "            ),\n"
              "          ),\n"
              "          const SizedBox(height: 20),\n"
          )

          src["ui"] = replace_once(
              src["ui"],
              r"^[ \t]*_Label\(\s*'MEDIA'\s*\)",
              ui_add + "          _Label('MEDIA')",
              "UI shortcuts",
          )

          # Write only after all patches have succeeded.

          for key, path in files.items():
              path.write_text(src[key])

          print("All patches applied successfully.")
          print("App Link feature negotiation enabled.")
          print("UI notifier:", notifier)
          PY

      - name: Install dependencies
        working-directory: app_source
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: app_source
        run: flutter analyze

      - name: Build APK
        working-directory: app_source
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-Remote-APK
          path: app_source/build/app/outputs/flutter-apk/app-release.apk
