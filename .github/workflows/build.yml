name: Build TV Remote APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Checkout Android TV Remote source
        uses: actions/checkout@v4
        with:
          repository: SebghatYusuf/android_remote
          path: app_source

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Modify TV Remote
        working-directory: app_source
        run: |
          python3 - <<'PY'
          import re
          import sys
          from pathlib import Path

          def fail(msg):
              print("PATCH ERROR:", msg)
              sys.exit(1)

          def insert_before(text, patterns, addition, label):
              for pattern in patterns:
                  ms = list(re.finditer(pattern, text, re.M))
                  if len(ms) == 1:
                      pos = ms[0].start()
                      return text[:pos] + addition + text[pos:]
              fail(f"{label}: no unique anchor found")

          proto = Path("lib/src/proto/remote.pb.dart")
          client = Path("lib/src/services/tv_remote_client.dart")
          provider = Path("lib/src/providers/remote_provider.dart")
          ui = Path("lib/src/ui/tv_remote_screen.dart")

          for f in (proto, client, provider, ui):
              if not f.exists():
                  fail(f"missing file {f}")

          p = proto.read_text()
          c = client.read_text()
          pr = provider.read_text()
          u = ui.read_text()

          # Sanity checks on names this patch relies on
          for name in ("_bytesField", "frameMessage"):
              if name not in p:
                  fail(f"{name} not found in {proto}")
          for name in ("_isConnected", "_commandSocket", "_handleDisconnection"):
              if name not in c:
                  fail(f"{name} not found in {client}")
          if "_remoteClient" not in pr:
              fail(f"_remoteClient not found in {provider}")
          for name in ("_Btn", "_Card", "_Label"):
              if name not in u:
                  fail(f"{name} not found in {ui}")

          # 1. Protocol: app link launch message (RemoteMessage field 90)
          p = insert_before(
              p,
              [
                  r"^[ \t]*///[ \t]*Send a key event",
                  r"^[ \t]*static\s+Uint8List\s+buildKeyInject\b",
              ],
              "  static Uint8List buildAppLinkLaunch(String appLink) =>\n"
              "      frameMessage(_bytesField(90, _bytesField(1, appLink.codeUnits)));\n\n",
              "protocol",
          )

          # 2. Client method
          c = insert_before(
              c,
              [r"^[ \t]*void\s+sendKeyPress\s*\("],
              "  void launchAppLink(String appLink) {\n"
              "    if (!_isConnected || _commandSocket == null) return;\n"
              "    try {\n"
              "      _commandSocket!.add(RemoteMessage.buildAppLinkLaunch(appLink));\n"
              "    } catch (e) {\n"
              "      _handleDisconnection('Failed to launch app: $e');\n"
              "    }\n"
              "  }\n\n",
              "client",
          )

          # 3. Provider method
          pr = insert_before(
              pr,
              [r"^[ \t]*void\s+sendKeyPress\s*\("],
              "  void launchAppLink(String appLink) =>\n"
              "      _remoteClient?.launchAppLink(appLink);\n\n",
              "provider",
          )

          # 4. UI: detect notifier variable name
          m = re.search(r"(\w+)\.sendKeyPress\s*\(", u)
          if not m:
              fail("UI notifier not found")
          n = m.group(1)

          apps = [
              ("YOUTUBE", "smart_display_rounded", "com.google.android.youtube.tv"),
              ("F LAUNCHER", "home_work_rounded", "me.efesser.flauncher"),
              ("PLAY STORE", "shop_rounded", "com.android.vending"),
              ("FILES", "folder_rounded", "com.alphainventor.filemanager"),
              ("ADB TV", "build_rounded", "com.cybercat.adbappcontrol.tv"),
          ]

          buttons = ""
          for label, icon, pkg in apps:
              buttons += (
                  "                _Btn(\n"
                  f"                  icon: Icons.{icon},\n"
                  f"                  label: '{label}',\n"
                  f"                  onTap: () => {n}.launchAppLink('market://launch?id={pkg}'),\n"
                  "                ),\n"
              )

          addition = (
              "          _Label('APPS'),\n"
              "          _Card(\n"
              "            child: Wrap(\n"
              "              alignment: WrapAlignment.spaceEvenly,\n"
              "              spacing: 12,\n"
              "              runSpacing: 16,\n"
              "              children: [\n"
              + buttons +
              "              ],\n"
              "            ),\n"
              "          ),\n"
              "          const SizedBox(height: 20),\n"
              "          _Label('DEVICE'),\n"
              "          _Card(\n"
              "            child: Row(\n"
              "              mainAxisAlignment: MainAxisAlignment.spaceEvenly,\n"
              "              children: [\n"
              f"                _Btn(icon: Icons.settings_rounded, label: 'SETTINGS', onTap: () => {n}.sendKeyPress(176)),\n"
              f"                _Btn(icon: Icons.power_settings_new_rounded, label: 'POWER', onTap: () => {n}.sendKeyPress(26)),\n"
              "              ],\n"
              "            ),\n"
              "          ),\n"
              "          const SizedBox(height: 20),\n"
          )

          u = insert_before(
              u,
              [r"^[ \t]*_Label\(\s*'MEDIA'\s*\)"],
              addition,
              "UI MEDIA section",
          )

          # Write only after every step succeeded
          proto.write_text(p)
          client.write_text(c)
          provider.write_text(pr)
          ui.write_text(u)

          print("PATCH SUCCESS. UI notifier variable:", n)
          PY

      - name: Install dependencies
        working-directory: app_source
        run: flutter pub get

      - name: Analyze Dart code
        working-directory: app_source
        run: flutter analyze --no-fatal-infos --no-fatal-warnings || true

      - name: Build APK
        working-directory: app_source
        run: flutter build apk --release --android-skip-build-dependency-validation

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TV-Remote-APK
          path: app_source/build/app/outputs/flutter-apk/app-release.apk
